# Render Blueprint: one web service that builds the website and runs the backend, which serves both
# the website and its API (/api/...). The only required value is MONGODB_URI; the WhatsApp (GREEN_API_*)
# and email (SMTP_*) values are needed to really send messages (see README).
services:
  - type: web
    name: yarok
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix site install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI # MongoDB Atlas connection string
        sync: false
      - key: MONGODB_DB
        value: yarok
      - key: JWT_SECRET # signs logins; generated once by Render
        generateValue: true
      - key: MESSAGING_DRY_RUN # set to "false" to really send WhatsApp and email (otherwise only logged)
        value: "true"
      - key: ENABLE_CRON # scheduled reminders and summaries
        value: "false"
      - key: GEMINI_API_KEY # optional: Google AI Studio key for the AI assistant and fleet document reading
        sync: false
      # WhatsApp (Green API): idInstance / apiTokenInstance from console.green-api.com
      - key: GREEN_API_URL # the instance's apiUrl, e.g. https://7105.api.greenapi.com
        value: https://api.green-api.com
      - key: GREEN_API_INSTANCE_ID
        sync: false
      - key: GREEN_API_TOKEN
        sync: false
      # Email from the company mailbox (SMTP)
      - key: SMTP_HOST # smtp.gmail.com (Google Workspace) or smtp.office365.com (Microsoft 365)
        sync: false
      - key: SMTP_PORT # 465 for Google Workspace, 587 for Microsoft 365
        sync: false
      - key: SMTP_SECURE # "true" for port 465, "false" for 587 (STARTTLS)
        sync: false
      - key: SMTP_USER # the mailbox, e.g. office@yaroknet.co.il
        sync: false
      - key: SMTP_PASS # App Password (Google) or the mailbox password (Microsoft 365)
        sync: false
      - key: SMTP_FROM # e.g. ירוק <office@yaroknet.co.il>
        sync: false
