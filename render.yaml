# Render Blueprint: backend (Node web service) + website (static site).
# Values marked `sync: false` are entered in the Render dashboard when the Blueprint is created.
services:
  - type: web
    name: yarok-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI # MongoDB Atlas connection string
        sync: false
      - key: MONGODB_DB
        value: yarok
      - key: SITE_URL # public URL of the yarok-site static site, e.g. https://yarok-site.onrender.com
        sync: false
      - key: JWT_SECRET # from `npm run keys:production`
        sync: false
      - key: ANON_KEY
        sync: false
      - key: SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_DRY_RUN # set to "false" to really send WhatsApp / n8n / email
        value: "true"
      - key: ENABLE_CRON
        value: "false"
      - key: ENABLE_DB_TRIGGERS
        value: "false"
      - key: LOVABLE_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    name: yarok-site
    runtime: static
    rootDir: site
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL # https://<yarok-api URL>/api/site
        sync: false
      - key: VITE_EMPLOYEES_API_URL # https://<yarok-api URL>/api/ops
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY # the ANON_KEY of yarok-api
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        value: yarok
    routes:
      - type: redirect
        source: /ops/*
        destination: /employees/
      - type: redirect
        source: /quote/:token
        destination: /employees/quote/:token
      - type: rewrite
        source: /*
        destination: /index.html
